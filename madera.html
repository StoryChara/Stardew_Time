<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruleta de Cultivo</title>
</head>
<body>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="master.js"></script>

    <h1 id="titulo"><i class="fa-solid fa-apple-whole"></i><br> Ruleta de Cultivo </h1>

    <div class="clock" id="clock"> Aquí podrás ver la madera conseguida: </div>

    <div class="probabilidad" id="probabilidad"></div>

    <div id="render-button-container" class="button-container"></div>
    <script> renderButtons("render-button-container"); </script>

    <footer class="footer"></footer>
</body>
</html>

<script>
    
    function mostrarContenido() {
        const storeElement = document.getElementById("probabilidad");
        const randomNumber = Math.floor(Math.random() * (80 - 70 + 1)) + 70;
        storeElement.innerHTML = `¡Ha conseguido ${randomNumber} de madera!`;
    }

    mostrarContenido();
</script>
