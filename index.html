<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stardew Valley Reloj</title>
  <style>
    @font-face {
      font-family: "PixelatedElegance";
      src: url("resources/huslyunicode.ttf");
    }

    @font-face {
      font-family: "StardewFont";
      src: url("resources/StardewValley.ttf");
    }

    body {
      background-image: url("resources/bg.png"); 
      background-size: cover; 
      background-repeat: no-repeat;
      background-position: center;
      display: flex;
      flex-direction: column; 
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    #titulo {
      font-family: "StardewFont";
      color: #6a1f16;
      text-align: center;
      font-size: 4rem; 
      margin-bottom: 20px;
      text-shadow: 3px 3px 6px rgba(52, 13, 12, 0.267);
    }

    .clock {
      font-size: 2.5rem;
      color: #6a1f16;
      font-family: "PixelatedElegance";
      text-align: center;
      padding: 10px;
      margin: 25px 75px;
      width: 75%;
      border: 1px solid rgb(58, 18, 0);
      border-radius: 1px;
      background-color: rgba(255, 225, 225, 0.479); 
      box-shadow: 0 4px 8px rgba(58, 18, 0, 0.521);
      animation: pulse 2s infinite;
    }

    .clock i {
  font-size: 1.75rem; 
}

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }
  </style>
</head>
<body>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <h1 id="titulo"><i class="fa-solid fa-signs-post"></i><br> Bienvenido a <br> Pueblo Pelicano </h1>

  <div class="clock" id="clock">...</div>
</body>
</html>

<script>
  const startTime = new Date("2024-12-21T23:55:00Z").getTime();
  const speedFactor = 1/3;
  const seasons = [ 'Primavera <i class="fa-solid fa-seedling"></i>',
                    'Verano <i class="fa-solid fa-umbrella-beach"></i>',
                    'Otoño <i class="fa-brands fa-canadian-maple-leaf"></i>',
                    'Invierno <i class="fa-regular fa-snowflake"></i>' ];

  const days = [  'Lunes',
                  'Martes',
                  'Miércoles',
                  'Jueves',
                  'Viernes',
                  'Sábado',
                  'Domingo' ];

  const weather = [ '--',
                    'Soleado <i class="fa-solid fa-sun"></i>',
                    'Lluvioso <i class="fa-solid fa-cloud-showers-heavy"></i>',
                    'Viento <i class="fa-solid fa-wind"></i>',
                    'Nublado <i class="fa-solid fa-cloud-sun"></i>',
                    'Tormenta <i class="fa-solid fa-cloud-bolt"></i>',
                    'Nevado <i class="fa-solid fa-snowflake"></i>',
                    'Lluvia Verde <i class="fa-solid fa-exclamation"></i>',
                    'Lluvia Ácida <i class="fa-solid fa-triangle-exclamation"></i>'];

  const lucky = [ '--',
                  'Los espíritus están muy felices <i class="fa-regular fa-face-laugh-beam"></i>',
                  'Los espíritus están de buen humor <i class="fa-regular fa-face-smile-beam"></i>',
                  'Los espíritus están neutros <i class="fa-regular fa-face-meh"></i>',
                  'Los espíritus están molestos <i class="fa-regular fa-face-frown-open"></i>',
                  'Los espíritus están muy descontentos <i class="fa-regular fa-face-frown"></i>' ];

let clima; let suerte;

  function updateClock() {
    const nowReal = new Date().getTime();
    const elapsedReal = nowReal - startTime;
    const elapsedSimulated = elapsedReal * speedFactor;
    const currentSimulated = new Date(startTime + elapsedSimulated);

    const hours = String(currentSimulated.getUTCHours()).padStart(2, "0");
    const minutes = String(currentSimulated.getUTCMinutes()).padStart(2, "0");
    const seconds = String(currentSimulated.getUTCSeconds()).padStart(2, "0");

    const totalDaysElapsed = Math.floor(elapsedSimulated / (1000 * 60 * 60 * 24));
    const dayOfMonth = (totalDaysElapsed % 28) + 1;
    const actualDay = (totalDaysElapsed % 7);
    const seasonIndex = Math.floor(totalDaysElapsed / 28) % 4; 

    fetch('stats.txt')
    .then(response => {
      if (!response.ok) {
        throw new Error('--');
      }
      return response.text();
    })
    .then(text => {
      const lines = text.split('\n'); 

      clima = parseInt(lines[10]) || 0; 
      suerte = parseInt(lines[19]) || 0; 
    })
    .catch(error => {
      console.error('--');
    });
    
    document.getElementById("clock").innerHTML = `${days[actualDay]} ${String(dayOfMonth).padStart(2, "0")}, ${hours}:${minutes} <br> 
                                                  ${seasons[seasonIndex]}, ${weather[clima]} <br>
                                                  ${lucky[suerte]}`;
  }

  setInterval(updateClock, 1000);
  updateClock();
</script>
