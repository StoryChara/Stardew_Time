<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stardew Valley Reloj</title>
  <style>
    @font-face {
      font-family: "PixelatedElegance";
      src: url("resources/PixelatedEleganceRegular.ttf");
    }

    @font-face {
      font-family: "StardewFont";
      src: url("resources/StardewValley.ttf");
    }

    body {
      background-image: url("resources/bg.png"); 
      background-size: cover; 
      background-repeat: no-repeat;
      background-position: center;
      display: flex;
      flex-direction: column; 
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    #titulo {
      font-family: "StardewFont";
      color: #6a1f16;
      display: flex;
      flex-direction: column;
      text-align: center;
      justify-content: center;
      align-items: center;
      font-size: 4rem; 
      margin-bottom: 20px;
      text-shadow: 3px 3px 6px rgba(52, 13, 12, 0.267);
      /*text-shadow: 3px 3px 6px rgb(255, 217, 134);*/
    }

    .clock {
      font-size: 3rem;
      color: #6a1f16;
      font-family: "PixelatedElegance";
      display: flex;
      padding: 15px;
      border: 1px solid #3a1200;
      border-radius: 1px;
      background-color: rgba(255, 225, 225, 0.479); 
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
  0%, 100% {
    transform: scale(1);
  }
  50% {
    transform: scale(1.05);
  }
}
  </style>

</head>
<body>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<h1 id="titulo"><i class="fa-solid fa-signs-post"></i> Hora Actual en<br>Pueblo Pelicano </h1>

  
  <div class="clock" id="clock">...</div>
</body>
</html>

<script>
  const startTime = new Date("2024-11-14T15:30:00Z").getTime();

  const speedFactor = 1 / 3;

  function updateClock() {
    const nowReal = new Date().getTime(); 
    const elapsedReal = nowReal - startTime; 
    const elapsedSimulated = elapsedReal * speedFactor; 

    const currentSimulated = new Date(startTime + elapsedSimulated);

    const hours = String(currentSimulated.getUTCHours()).padStart(2, "0");
    const minutes = String(currentSimulated.getUTCMinutes()).padStart(2, "0");
    const seconds = String(currentSimulated.getUTCSeconds()).padStart(2, "0");

    //document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds}`;
    document.getElementById("clock").textContent = `${hours}:${minutes}`;
  }

  setInterval(updateClock, 1000);

  updateClock();
</script>
