<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stardew Valley Reloj</title>
</head>
<body>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="styles.css">
  <script src="constants.js"></script>

  <h1 id="titulo"><i class="fa-solid fa-signs-post"></i><br> Bienvenido a <br> Pueblo Pelicano </h1>

  <div class="clock" id="clock">...</div>
  <div id="button-container" class="button-container"></div>
  <script> renderButtons("button-container"); </script>

  <footer class="footer"></footer>
</body>
</html>


<script>
  const startTime = new Date("2024-12-21T23:55:00Z").getTime();
  const speedFactor = 1/3;
  let clima; let suerte;

  function updateClock() {
    const nowReal = new Date().getTime();
    const elapsedReal = nowReal - startTime;
    const elapsedSimulated = elapsedReal * speedFactor;
    const currentSimulated = new Date(startTime + elapsedSimulated);

    const hours = String(currentSimulated.getUTCHours()).padStart(2, "0");
    const minutes = String(currentSimulated.getUTCMinutes()).padStart(2, "0");
    const seconds = String(currentSimulated.getUTCSeconds()).padStart(2, "0");

    const totalDaysElapsed = Math.floor(elapsedSimulated / (1000 * 60 * 60 * 24));
    const dayOfMonth = (totalDaysElapsed % 28) + 1;
    const actualDay = (totalDaysElapsed % 7);
    const seasonIndex = Math.floor(totalDaysElapsed / 28) % 4; 
    localStorage.setItem("seasonIndex", seasonIndex);

    fetch('stats.txt')
    .then(response => {
      if (!response.ok) {
        throw new Error('--');
      }
      return response.text();
    })
    .then(text => {
      const lines = text.split('\n'); 

      clima = parseInt(lines[10]) || 0; 
      if (clima < 0 || clima > 8){ clima = 0; }
      suerte = parseInt(lines[19]) || 0; 
      if (suerte < 0 || suerte > 5){ suerte = 0; }
    })
    .catch(error => {
      console.error('--');
    });
    
    document.getElementById("clock").innerHTML = `${seasons[seasonIndex]} <br>
                                                  ${days[actualDay]} ${String(dayOfMonth).padStart(2, "0")}, ${hours}:${minutes} <br>                                               
                                                  ${weather[clima]} <br>
                                                  ${lucky[suerte]}`;
  }

  setInterval(updateClock, 1000);
  updateClock();
</script>
