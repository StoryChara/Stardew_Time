<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reloj Simulado</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #2c3e50;
      color: #ecf0f1;
    }
    .clock {
      font-size: 2rem;
    }
  </style>
</head>
<body>
  <div class="clock" id="clock">Cargando...</div>

  <script>
    // Tiempo inicial en UTC
    const startTime = new Date("2024-11-15T07:00:00Z").getTime();

    // Factor de velocidad (1 minuto simulado = 3 minutos reales)
    const speedFactor = 1 / 3;

    // Función para actualizar el reloj
    function updateClock() {
      const nowReal = new Date().getTime(); // Tiempo real actual
      const elapsedReal = nowReal - startTime; // Tiempo transcurrido desde el inicio en ms
      const elapsedSimulated = elapsedReal * speedFactor; // Tiempo simulado en ms

      // Nuevo tiempo simulado
      const currentSimulated = new Date(startTime + elapsedSimulated);

      // Formatear la hora para mostrar
      const hours = String(currentSimulated.getUTCHours()).padStart(2, "0");
      const minutes = String(currentSimulated.getUTCMinutes()).padStart(2, "0");
      const seconds = String(currentSimulated.getUTCSeconds()).padStart(2, "0");

      document.getElementById("clock").textContent = `${hours}:${minutes}:${seconds} UTC`;
    }

    // Actualizar el reloj cada segundo
    setInterval(updateClock, 1000);

    // Iniciar el reloj
    updateClock();
  </script>
</body>
</html>
