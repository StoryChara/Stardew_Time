<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stardew Valley Reloj</title>
  <style>
    @font-face {
      font-family: "PixelatedElegance";
      src: url("resources/huslyunicode.ttf");
    }

    @font-face {
      font-family: "StardewFont";
      src: url("resources/StardewValley.ttf");
    }

    body {
      background-image: url("resources/bg.png"); 
      background-size: cover; 
      background-repeat: no-repeat;
      background-position: center;
      display: flex;
      flex-direction: column; 
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    
    #titulo {
      font-family: "StardewFont";
      color: #6a1f16;
      text-align: center;
      font-size: 4rem; 
      margin-bottom: 20px;
      text-shadow: 3px 3px 6px rgba(52, 13, 12, 0.267);
    }

    .clock{
      font-size: 3rem;
      color: #6a1f16;
      font-family: "PixelatedElegance";
      text-align: center;
      padding: 12px;
      margin: 10px;
      border: 1px solid rgb(58, 18, 0);
      border-radius: 1px;
      background-color: rgba(255, 225, 225, 0.479); 
      box-shadow: 0 4px 8px rgba(58, 18, 0, 0.521);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }
  </style>
</head>
<body>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <h1 id="titulo"><i class="fa-solid fa-signs-post"></i><br> Hora Actual en<br>Pueblo Pelicano </h1>

  <div class="clock" id="clock">...</div>
</body>
</html>

<script>
  const startTime = new Date("2024-12-22T00:00:00Z").getTime();
  const speedFactor = 1 / 3;
  const seasons = [
    'Primavera <i class="fa-solid fa-seedling"></i>',
    'Verano <i class="fa-solid fa-umbrella-beach"></i>',
    'Otoño <i class="fa-brands fa-canadian-maple-leaf"></i>',
    'Invierno <i class="fa-regular fa-snowflake"></i>'
  ];

  function updateClock() {
    const nowReal = new Date().getTime();
    const elapsedReal = nowReal - startTime;
    const elapsedSimulated = elapsedReal * speedFactor;

    const currentSimulated = new Date(startTime + elapsedSimulated);

    const hours = String(currentSimulated.getUTCHours()).padStart(2, "0");
    const minutes = String(currentSimulated.getUTCMinutes()).padStart(2, "0");
    const seconds = String(currentSimulated.getUTCSeconds()).padStart(2, "0");

    const totalDaysElapsed = Math.floor(elapsedSimulated / (1000 * 60 * 60 * 24));
    const dayOfMonth = (totalDaysElapsed % 28) + 1;
    const seasonIndex = Math.floor(totalDaysElapsed / 28) % 4; 
    
    document.getElementById("clock").innerHTML = 
    `${hours}:${minutes} <br> 
    Día ${dayOfMonth}, ${seasons[seasonIndex]}`;
  }

  setInterval(updateClock, 1000);

  updateClock();
</script>
