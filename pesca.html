      function obtenerElementoAleatorio(arr) {
        const indiceAleatorio = Math.floor(Math.random() * arr.length);
        return arr[indiceAleatorio];
      }

      function mostrarContenido(lugar) {
        const storeElement = document.getElementById("probabilidad");
        const seasonIndex = parseInt(localStorage.getItem("seasonIndex"), 10);
        const hours = parseInt(localStorage.getItem("hours"), 10);
        let clima = parseInt(localStorage.getItem("clima", 10));

        let resultado = `-`;
        let item = `-`;
        let opciones = [];
        let pescadosFiltrados;

        let esta = seasons[seasonIndex];
        clima = weather[clima];
        let hora = '--';

        if (7<=hours && hours<=12){ hora = 'Mañana';
        } else if (12<=hours && hours<=20){ hora = 'Tarde';
        } else if ((20<=hours && hours<=24) || (0<=hours && hours<=2)){ hora = 'Noche';
        } else { hora = 'Madrugada'; }

        const randomNumber = Math.random().toFixed(2);

        if (randomNumber <= 0.25){
          resultado = `¡El pescado ha escapado!`
        } else if (randomNumber <= 0.55) {
          resultado = `¡Has pescado ${obtenerElementoAleatorio(basura).name}!`
        } else {
          

          if (lugar === "Isla Jengibre") {
              pescadosFiltrados = pescados.filter((pescado) =>
                  pescado.ubi.includes("Isla Jengibre")
              );
          } else {
              pescadosFiltrados = pescados.filter((pescado) =>
                  pescado.ubi.split(" ").includes(lugar) &&
                  (pescado.hora.includes(hora) || pescado.hora === "Todas") &&
                  (pescado.esta.includes(esta) || pescado.esta === "Todas") &&
                  (pescado.clima.includes(clima) || pescado.clima === "Todas")
              );
          }

          if (pescadosFiltrados.length > 0) {
              resultado = `¡Has pescado un ${obtenerElementoAleatorio(pescadosFiltrados).name}!`;
          } else {
              resultado = `No hay pescados disponibles en esta ubicación, hora, estación o clima.`;
          }
        }

        resultado += `<br><div class="number">${randomNumber}</div>`
        
        storeElement.innerHTML = `${resultado}
        `;  
      }
